# pipeline.yml -- sidecar pipeline config (D-14)
#
# Declares the VARIABLE marker set (D-01), the detection/segmentation ANCHOR
# channel (D-02 -- config-declared, never hardwired to DAPI), region
# exclusions and tuning literals migrated out of scripts/02_detect_classify.groovy
# (D-09), and the ring geometry used for cytoplasmic-compartment measurement.
#
# This file is SEPARATE from BraiAn.yml (D-14): BraiAn.yml stays
# BraiAnDetect's detection-params file (sigma/minArea/maxArea/histogramThreshold/
# cellExpansionMicrons/etc.) -- this file MUST NOT contain any of those keys.
# pipeline.yml is a pipeline/marker-set concern, read by the classify/export
# groovy scripts (02_detect_classify.groovy, the consolidated export) alongside
# BraiAn.yml, not instead of it.
#
# Compartment semantics (project rule, CLAUDE.md -- nucleus-anchored
# colocalization only; REVISED 2026-07-25, w88): a marker declared
# `compartment: nuclear` is measured on the segmented DAPI nucleus itself
# (e.g. Fos, which is a nuclear/recall marker); a marker declared
# `compartment: cytoplasmic` is measured on the cytoplasmic expansion RING
# built outward from that same nucleus (for markers whose signal is strictly
# cytosolic); a marker declared `compartment: whole-cell` is measured on the
# WHOLE CELL (nucleus + cytoplasmic ring), QuPath's area-weighted whole-cell
# mean -- for markers whose signal fills the whole cell (TdTomato here,
# operator-confirmed domain observation 2026-07-25: measuring it on the ring
# alone under-counts it). The compartment is declared here, per marker, but
# the wiring (nuclear -> Nucleus, cytoplasmic -> Cytoplasm ring, whole-cell ->
# Cell area-weighted) is fixed code, not configurable -- this file only says
# WHICH marker gets WHICH treatment. cytoplasmic remains available and fully
# working for any future strictly-cytosolic marker.
#
# Double+ auto-derivation (D-03): "Double+" is emitted ONLY when >=2
# non-anchor markers are declared below. On a single-marker (e.g. TdT-only)
# config, Double+ is simply never produced -- no Fos rows/columns appear
# anywhere downstream. This is enforced by scripts/validate_pipeline_config.py
# and by every consumer iterating `markers` rather than assuming a fixed pair.

# D-02: the channel used for nucleus/cell segmentation (BraiAnDetect's
# channelDetections anchor in BraiAn.yml). Declared here so every groovy/python
# consumer reads it from one place instead of assuming "DAPI" by name.
anchor:
  name: "DAPI"                # [ASSUMED] seed default -- tunable per slice-set, not locked
  channel: "DAPI-T4"           # matches server.json / BraiAn.yml channelDetections name exactly

# D-01: name -> channel -> compartment. Declare ONE entry per non-anchor
# marker present on this slice-set. Order does not matter; compartment MUST
# be exactly "nuclear", "cytoplasmic", or "whole-cell".
#
# Seed values below mirror the current wBA1-3 working set (BraiAn.yml
# classifiers block) -- [ASSUMED] seed, tunable per slice-set, not locked.
markers:
  - name: "Fos"                 # recall marker -- nuclear compartment (CLAUDE.md)
    channel: "AF488-T3"         # matches BraiAn.yml classifiers[0].channel
    compartment: "nuclear"
  - name: "TdT"                 # engram marker (TdTomato) -- fills the whole cell, whole-cell area-weighted mean (CLAUDE.md, revised 2026-07-25, operator domain call)
    channel: "AF568-T2"         # matches BraiAn.yml classifiers[1].channel
    compartment: "whole-cell"
    k_robust: 2.0               # PER-MARKER override, set 2026-08-01 to MATCH M3 Hipp2
                                # and M5. Hipp1 previously ran at the global 3.0, which
                                # made it non-comparable with them: the same sections
                                # yield ~2x more TdT+ at k=2.0 (3.51% -> 6.84% measured
                                # on Hipp2 s3). Same pixel size (0.460357) and sigma
                                # (2.0) as Hipp2, so k was the only blocking difference.

# D-09: region exclusions migrated out of the EXCLUDE_ACRONYMS literal
# (scripts/02_detect_classify.groovy line 92). DG-sg = DG granule cell layer
# (too dense for per-nucleus segmentation); VS = ventricular systems.
# (DG-mo/DG-po intentionally stay in -- do not add them here.)
exclude_acronyms: ["DG-sg", "VS"]

# D-09: robust self-calibrating positive-threshold multiplier, migrated from
# the K_ROBUST literal (scripts/02_detect_classify.groovy line 286). Threshold
# = median + k_robust * 1.4826 * MAD on the per-marker background-subtracted
# measure. [ASSUMED] seed value -- re-sweep on imaging-parameter drift (Phase 7 IMG-01).
k_robust: 3.0

# D-09: cytoplasmic expansion ring geometry, migrated from the GAP_UM /
# RING_WIDTH_UM literals (scripts/02_detect_classify.groovy lines 143-144).
# gap_um = the annular gap left between the nucleus boundary and the inner
# edge of the measurement ring; width_um = the ring's radial thickness. Used
# only for markers declared `compartment: cytoplasmic` above.
ring:
  gap_um: 1.0
  width_um: 8.0

# ── added by scripts/sync_project.py (block required by the current scripts) ──
# ── Detection threshold (anchor channel) — ACQUISITION-AGNOSTIC ──────────────
# The intensity cut that decides which pixels are nucleus, on the anchor channel.
# This is NOT the marker-positivity cut (that is `k_robust` above); it is the
# upstream BraiAnDetect watershed threshold, and it is the single biggest
# obstacle to running this pipeline on anyone else's images.
#
# HISTORY (read before changing): BraiAn.yml offers two native options and BOTH
# fail to generalize on our data:
#   * `histogramThreshold` (self-calibrating) needs a distinct DIM-NUCLEI peak.
#     Our sections do not have one -- a sweep on M3 Hipp1 s? (2026-07-28) found
#     only a background floor (162) and a bright-nuclei peak (2268). The method
#     could therefore return only 162 (floods noise) or ~2268 (drops every dim
#     nucleus). It is unusable here.
#   * `threshold` (absolute) was set to 700 as a result. It works on the section
#     it was tuned on and silently UNDER-DETECTS on any dimmer section, animal,
#     or acquisition. That is a comparability bug, not a preference.
#
# THE RULE USED INSTEAD: place the cut a fixed FRACTION of the way up the span
# between the two peaks that ARE reliably findable:
#
#     threshold = floor + span_frac * (bright_peak - floor)
#
# Both endpoints are re-measured PER SECTION from that section's own histogram,
# so the cut tracks staining and laser drift automatically -- the property that
# makes cross-section and cross-animal comparison valid -- while needing no dim
# peak to exist.
#
# WHY span_frac 0.25: it reproduces the operator's own visual judgement on the
# section where 700 was chosen by eye. floor=162, bright=2268, so
# (700-162)/(2268-162) = 0.256. The absolute value 700 was a correct call about
# THAT section; 0.25 is that same call expressed in a form that transfers.
#
# TO ADJUST: raise span_frac -> stricter (fewer, brighter nuclei); lower it ->
# catches dimmer nuclei, toward the background floor. Visualize where the cut
# lands on the real histogram before changing it:
#   1. QuPath: run scripts/calibrate_threshold.groovy on one slice
#   2. notebooks/01_calibrate.ipynb section 3 plots the histogram + the sweep
detection_threshold:
  mode: "span_fraction"       # "span_fraction" (recommended) | "absolute" (escape hatch, does NOT generalize)
  span_frac: 0.25             # [ASSUMED] seed -- reproduces the 2026-07-28 operator visual call; re-check per slice-set
  absolute: null              # used ONLY when mode is "absolute"; null otherwise
  # Peak-finding params handed to BraiAnDetect's findThreshold for BOTH endpoints.
  # resolution_level MUST be 0 -- BraiAn's default of 4 is what produced the
  # historical "no valid peak" errors.
  resolution_level: 0
  smooth_window: 15
  peak_prominence: 100
