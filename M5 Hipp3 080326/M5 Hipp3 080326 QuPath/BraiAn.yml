# BraiAn.yml -- qupath-extension-braian (BraiAnDetect) v1.1.0 config
# M5 Hipp3 080326, 2 scenes, 2-plane hybrid MIP (DAPI single-plane + marker MIP).
# Channels: DAPI-T4 (anchor) + AF568-T2 (TdTomato) + AF488-T3 (Fos). MULTI-MARKER.
#
# ACQUISITION REGIME: 0.690535481770835 um/px, 2 Z-planes -- the M5 072526 family,
# NOT the M3 family (0.4603569878472219 um/px, 4 planes). This file was first copied
# from M3 Hipp2 and carried M3's pixel size, which does not describe these images;
# corrected 2026-08-04. Comparable with M5 072526; NOT directly comparable with any
# M3 dataset on density or any DAPI-normalised metric (CLAUDE.md comparability rule --
# relative thresholds absorb brightness drift but not geometry).
#
# The micron-denominated seeds below are unchanged from both prior projects, which used
# identical values at both pixel sizes. But note a nucleus is ~2.25x FEWER PIXELS here
# than at 0.46 um/px, so if segmentation looks wrong on the calibration section,
# sigmaMicrons is the first knob -- not the threshold.
#
# ONE change vs the Hipp1 config: the absolute `threshold: 700` and the commented
# `histogramThreshold:` block are DELETED. The anchor-channel detection threshold is
# no longer read from this file at all -- run_braian_detection.groovy computes it per
# section as floor + span_frac * (bright_peak - floor) from pipeline.yml's
# `detection_threshold` (span_frac 0.25). An absolute cut silently under-detects on
# any section dimmer than the one it was tuned on; that is a comparability bug, not a
# preference (CLAUDE.md, 2026-07-29).
#
# requestedPixelSizeMicrons MUST equal this project's PhysicalSizeX exactly
# (0.690535481770835, read from the CZI metadata by czi_mip.py and stamped into the
# MIP's OME-XML) or BraiAnDetect resamples and nucleus areas come out wrong.
#
# Use the FULL-PRECISION value, not a rounded one. Both earlier projects rounded to 7
# digits (0.6905355, 0.460357) against OME values of 0.690535481770835 and
# 0.4603569878472219 -- physically irrelevant, but it leaves an exact float comparison
# unequal for no reason. Read it back with:
#     python -c "import tifffile,re; print(re.findall(r'PhysicalSizeX=\"([^\"]+)\"',
#         tifffile.TiffFile('<a MIP>.ome.tiff').ome_metadata)[0])"

# Confine detection to the ABBA atlas Root annotation (brain outline, class
# "allen_mouse_10um_java") instead of the full image rectangle -- else
# ChannelDetections watersheds background into hundreds of thousands of
# spurious "nuclei". Load ABBA ROIs (01_load_abba_rois.groovy) BEFORE detecting.
classForDetections: "allen_mouse_10um_java"

detectionsCheck:
  apply: false
  controlChannel: null

channelDetections:
  - name: "DAPI-T4"                          # nuclear anchor -- matches server.json channel name exactly
    parameters:
      requestedPixelSizeMicrons: 0.690535481770835   # THIS project's PhysicalSizeX -- no resampling
      backgroundRadiusMicrons: 10
      backgroundByReconstruction: true
      medianRadiusMicrons: 0.0
      sigmaMicrons: 2.0                      # hippocampal seed carried from Hipp1
      minAreaMicrons: 20.0                   # seed -- tune per D-05 (peak 50-150 um^2)
      maxAreaMicrons: 250.0                  # seed -- keeps DG/large-nuclei upper tail from being clipped
      # NO `threshold:` / `histogramThreshold:` key by design -- the anchor cut comes
      # from pipeline.yml `detection_threshold` (relative, re-measured per section).
      watershedPostProcess: true
      cellExpansionMicrons: 5.0              # creates the Cell/Cytoplasm compartment the TdT (AF568-T2) whole-cell measure reads
      includeNuclei: true
      smoothBoundaries: true
      makeMeasurements: true                 # REQUIRED -- produces the Nucleus:/Cell: per-channel means 02_detect_classify.groovy reads
    classifiers: []                          # intentionally empty -- one classification path, in 02_detect_classify.groovy from pipeline.yml
