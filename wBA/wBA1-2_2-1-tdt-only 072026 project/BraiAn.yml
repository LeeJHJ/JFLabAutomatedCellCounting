# BraiAn.yml -- qupath-extension-braian (BraiAnDetect) v1.1.0 config
# TdT-ONLY validation project: wBA1-2_2-1 (072026), 5 scenes, hybrid MIP.
#
# Adapted from wBA 1-3 2-1 072026/BraiAn.yml for this slice-set:
#   1. requestedPixelSizeMicrons 0.6905355 -> 0.460357  (NEW imaging; matches
#      this project's server.json PhysicalSizeX exactly -- must be right or
#      BraiAnDetect resamples and nucleus areas come out wrong).
#   2. classifiers block EMPTIED. This is a TdT-only set (channels DAPI-T4 +
#      AF568-T2; NO AF488-T3/Fos). The old Fos classifier referenced a channel
#      that does not exist here and would break run_braian_detection.groovy.
#      More importantly, classification is now done by the generalized,
#      config-driven `02_detect_classify.groovy` (reads pipeline.yml, robust
#      median + k*1.4826*MAD per marker) -- NOT by BraiAn.yml's fixed-threshold
#      classifier JSONs (see that script's header, "NOT BraiAn.yml's
#      classifiers"). run_braian_detection.groovy here does DETECTION +
#      per-channel makeMeasurements only; 02_detect_classify.groovy classifies.
#
# The sigma / area / threshold / cellExpansion values below are in MICRONS
# (pixel-size-independent) and carry over as STARTING SEEDS from the wBA1-3
# thin-z-stack tuning -- this new set is also a thin hybrid-MIP acquisition, so
# they are a reasonable start, but per CLAUDE.md TUNE ON ONE SECTION FIRST
# (delete detections -> edit here -> re-run run_braian_detection.groovy ->
# qc_detection_gates.groovy) against the D-05 gates (nucleus-area peak
# 50-150 um^2; DAPI density 500-2000/mm^2) before scaling to all 5 sections.

# Confine detection to the ABBA atlas Root annotation (56 mm^2 brain outline,
# class "allen_mouse_10um_java") instead of the full image rectangle -- else
# ChannelDetections watersheds background into ~380k spurious "nuclei".
classForDetections: "allen_mouse_10um_java"

detectionsCheck:
  apply: false
  controlChannel: null

channelDetections:
  - name: "DAPI-T4"                          # nuclear anchor -- matches server.json channel name exactly
    parameters:
      requestedPixelSizeMicrons: 0.460357    # THIS project's PhysicalSizeX (0.46 um/px, 20x hybrid MIP) -- no resampling
      backgroundRadiusMicrons: 10
      backgroundByReconstruction: true
      medianRadiusMicrons: 0.0
      sigmaMicrons: 2.0                      # seed from wBA1-3 (thin z-stack splits blobs cleanly at 2.0); confirm one-per-nucleus visually on one section
      minAreaMicrons: 20.0                   # seed -- tune per D-05 (peak 50-150 um^2)
      maxAreaMicrons: 250.0                  # seed -- keeps the upper tail (DG/large nuclei) from being clipped
      # --- ABSOLUTE threshold (operator trial, 2026-07-27) ---
      # DAPI histogram landmarks (find_threshold sweep on THIS section): background floor ~406,
      # dim-nuclei peak ~691, bright-nuclei peak ~1803. histogramThreshold can only land ON a peak
      # (nPeak=2 @ prom>=100 -> 1803 misses dim cells; prom=50 -> 691, a big jump). Absolute lets
      # you pick any cutoff in between. Cells with DAPI mean above this value seed detection.
      # DIAL: LOWER -> catches dimmer cells (toward ~700); RAISE -> fewer (toward ~1800). Tune visually on the LA.
      # Absolute is NOT self-calibrating across sections (D-01 tradeoff) -- fine for one-section tuning;
      # to go back to the series-scalable path, delete `threshold:` and uncomment the block below.
      #threshold: 1000
      histogramThreshold:
        resolutionLevel: 0
        smoothWindowSize: 15
        peakProminence: 45                 # 50 -> 691 (dim peak); >=100 -> 1803 (bright peak)
        nPeak: 2
      watershedPostProcess: true
      cellExpansionMicrons: 5.0              # creates the Cytoplasm compartment the TdT (AF568-T2) bg-sub measure reads; tune DG bleed if needed
      includeNuclei: true
      smoothBoundaries: true
      makeMeasurements: true                 # REQUIRED -- produces "Cytoplasm: AF568-T2 mean" that 02_detect_classify.groovy background-subtracts + thresholds
    classifiers: []                          # intentionally empty -- see header note (2); 02_detect_classify.groovy does the config-driven classification from pipeline.yml
